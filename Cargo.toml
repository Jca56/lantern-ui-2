[workspace]
resolver = "3"
members = [
    "crates/lntrn-math",
    "crates/lntrn-image",
    "crates/lntrn-core",
    "crates/lntrn-props",
    "crates/lntrn-text",
    "crates/lntrn-render",
    "crates/lntrn-ui",
    "crates/lntrn-app",
    "crates/lntrn-demo",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Alva"]

[workspace.dependencies]
lntrn-math = { path = "crates/lntrn-math" }
lntrn-image = { path = "crates/lntrn-image" }
lntrn-core = { path = "crates/lntrn-core" }
lntrn-props = { path = "crates/lntrn-props" }
lntrn-text = { path = "crates/lntrn-text" }
lntrn-render = { path = "crates/lntrn-render" }
lntrn-ui = { path = "crates/lntrn-ui" }
lntrn-app = { path = "crates/lntrn-app" }
wgpu = "28"
winit = "0.30"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
